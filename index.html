    <!-- ── Structured Data — FAQPage ────────────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do I mock AWS services locally with Python?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Install MockMesh with pip install mockmesh, then call mockmesh.initialize() at the top of your script. All boto3 calls (S3, DynamoDB, SQS, etc.) are automatically intercepted at the botocore transport layer — no credential setup, no Docker, no code changes to your application."
          }
        },
        {
          "@type": "Question",
          "name": "What is the difference between MockMesh and LocalStack?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "LocalStack runs actual AWS service emulators in Docker containers. MockMesh intercepts at the Python SDK transport layer — no Docker required. MockMesh also supports Azure, Kafka, RabbitMQ and any HTTP endpoint in the same library, with a 4-tier response resolution system and real file-backed stateful storage."
          }
        },
        {
          "@type": "Question",
          "name": "Does MockMesh support Azure SDK mocking?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. MockMesh patches azure-core's RequestsTransport.send at the transport level, intercepting all Azure SDK calls including Blob Storage, Cosmos DB, Service Bus, Key Vault, Redis, SQL, AKS, and ACI."
          }
        },
        {
          "@type": "Question",
          "name": "How do I override responses for specific AWS operations?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Create a folder with files named aws.json, azure.json, etc. (matching the built-in defaults naming) and pass the folder path via responses_path to mockmesh.initialize(). MockMesh deep-merges your overrides on top of built-in defaults — only include the operations you want to change. Alternatively, place the files in your .mockmesh/ workspace and they are picked up automatically."
          }
        },
        {
          "@type": "Question",
          "name": "Is MockMesh stateful?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Storage-backed operations (S3, DynamoDB, SQS, Cosmos DB, Service Bus, Key Vault, SSM, SecretsManager, ElastiCache) use real local file-backed stores. A DynamoDB PutItem actually writes to .mockmesh/nosql/TableName.json. A subsequent GetItem reads from that same file. Your application cannot distinguish this from the real cloud."
          }
        }
      ]
    }
    </script>
